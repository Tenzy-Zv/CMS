        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;

            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            width: 90%;
            padding: 15px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.8);
            overflow: auto;
            margin-top: 80px; /* To make space for the navbar */
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .header h1 {
            margin: 0;
        }

        .search-bar {
            margin-bottom: 15px;
        }

        .search-bar input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .categories {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .category {
            flex: 1;
            margin: 0 10px;
            min-width: 200px;
            max-width: 280px;
        }

        .category-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .menu-items {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .menu-item {
            background-color: white;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            flex: 1 1 45%;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .menu-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            margin-bottom: 5px;
        }

        .menu-item.selected {
            background-color: #d4edda; /* Greenish color */
            border: 2px solid green;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }

        .nav-item img {
            width: 25px;
            height: 25px;
        }

        /* Order Button Styling */
        .order-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 50px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .order-button:hover {
            background-color: #218838;
            transform: scale(1.05);
        }

        .order-button:focus {
            outline: none;
        }
    </style>

    <button id="orderButton" class="order-button">Order Now</button>

    <script>
        const menuItems = document.querySelectorAll('.menu-item');
        let selectedItems = [];

        menuItems.forEach(item => {
            item.addEventListener('click', () => {
                item.classList.toggle('selected');
                const itemName = item.querySelector('p').textContent;

                if (selectedItems.includes(itemName)) {
                    selectedItems = selectedItems.filter(selected => selected !== itemName);
                } else {
                    selectedItems.push(itemName);
                }
            });
        });

        const orderButton = document.getElementById('orderButton');
        orderButton.addEventListener('click', () => {
            localStorage.setItem('selectedItems', JSON.stringify(selectedItems)); // Store selected items
            window.location.href = 'MyOrder.html'; // Navigate to Edit My Order page
        });
    </script>
