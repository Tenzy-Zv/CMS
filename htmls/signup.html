<!-- Updated 'Create an Account' Page -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account</title>
    <style>
        /* Your existing CSS */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-image: url('/htmls/picturesSettings/terma45-1-of-1-scaled.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #000;
        }

        .container {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
        }

        .container img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin-bottom: 20px;
        }

        h2 {
            margin: 20px 0;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #000;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            box-sizing: border-box;
        }

        .terms {
            font-size: 12px;
            margin-top: 20px;
        }

        .terms a {
            color: #000;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/htmls/JNEC-Logo-100x100-1-removebg-preview.png" alt="College Logo">
        <h2>Create an account</h2>
        <p>Enter your email to sign up:</p>

        <!-- Email input field -->
        <input type="email" id="emailInput" placeholder="Enter your JNEC email" required>

        <!-- Password input field -->
        <input type="password" id="passwordInput" placeholder="Enter your password" required>

        <!-- Log in button -->
        <a href="/htmls/login.html">
            <button>Log in</button>
        </a>

        <p>or continue with</p>
        <!-- Sign up button -->
        <a href="/htmls/login.html">
            <button onclick="validateEmail()">Sign up with email</button>
        </a>
        <p class="terms">By clicking continue, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></p>
    </div>

    <script>
        function validateEmail() {
            const emailInputValue = document.getElementById("emailInput").value;
            const passwordInputValue = document.getElementById("passwordInput").value;
            const customerPattern = /^[0-9]+\.jnec@rub\.edu\.bt$/;
            const staffPattern = /^admin\.jnec@rub\.edu\.bt$/;

            const isCustomer = customerPattern.test(emailInputValue);
            const isAdmin = staffPattern.test(emailInputValue);

            if (isCustomer && passwordInputValue) {
                alert("Redirecting to the Customer Profile...");
                window.location.href = "/htmls/profile.html"; // Redirect to customer profile
            } else if (isAdmin && passwordInputValue) {
                alert("Redirecting to the Admin Profile...");
                window.location.href = "/htmls/admin-profile.html"; // Redirect to admin profile
            } else {
                if (!emailInputValue || (!isCustomer && !isAdmin)) {
                    alert("Please enter a valid JNEC email address.");
                } else if (!passwordInputValue) {
                    alert("Password is required.");
                }
            }
        }
    </script>
</body>
</html>
