<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Canteen Management System</title>
    <!-- Add Bootstrap CSS for Navbar -->
    <link href="/bootstrap/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('/htmls/picturesSettings/terma45-1-of-1-scaled.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 420px;
            width: 100%;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.8);
            margin-top: 70px; /* Adjust for fixed navbar */
        }

        .grid {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card {
            display: flex;
            align-items: center;
        }

        .card img {
            width: 100px;
            height: 100px;
            margin-right: 20px;
        }

        .card h2 {
            margin: 0;
            font-size: 1.5rem;
        }

        .logo img {
            width: 100px;
            height: 100px;
            object-fit: cover;
        }

        .orange-card,
        .red-card {
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .orange-card {
            background-color: #fb923c;
        }

        .red-card {
            background-color: #ef4444;
            color: white;
        }

        .view-menu {
            background-color: white;
            color: black;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            margin-top: 10px;
            display: inline-block;
        }

        /* Media queries for responsiveness */
        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }

            .grid {
                flex-direction: column;
            }

            .card,
            .orange-card,
            .red-card {
                height: auto;
            }

            .card img,
            .orange-card img {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item active">
                    <a class="nav-link" href="/htmls/1st_page.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="menu.html">Menu</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/htmls/MyOrder.html">My Order</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/htmls/customer_user_profile.html">My Profile</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/htmls/customer_feedback.html">Feedback</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/htmls/signup.html">Logout</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="grid">
            <div class="card">
                <img src="/htmls/removedbg/sikam.png" alt="Food">
                <h2><strong>JNEC Canteen</strong></h2>
            </div>
            <div class="logo">
                <img src="/htmls/JNEC-Logo-100x100-1-removebg-preview.png" alt="Logo">
            </div>
        </div>

        <div class="orange-card">
            <strong>Are you hungry? Come, order and fill your tummy :)</strong>
            <div style="display:flex;align-items:center;margin-top:10px;">
                <img src="/htmls/removedbg/suja.png" alt="Suja" style="width:120px;height:100px;margin-right:20px;">
                <img src="/htmls/removedbg/pokora.png" alt="Suja" style="width:120px;height:80px;margin-right:20px;">
                <strong>Suja with Pokora</strong>
            </div>
        </div>

        <div class="red-card">
            <strong>Bring Your Friends To Eat. We Offer you good food to taste.</strong>
            <div class="view-menu">
                <button class="btn customer-btn" onclick="window.location.href='menu.html';">view-menu</button>
                <img src="/htmls/removedbg/pngtree-order-now-icon-png-image_9115829-removebg-preview.png" alt="Cart" style="width:24px;height:24px;vertical-align:middle;">
            </div>
        </div>
    </div>

    <!-- Add Bootstrap JS and dependencies -->
    <script src="/bootstrap/bootstrap.bundle.js"></script>
    <script src="/bootstrap/bootstrap.min.js"></script>
    <script src="/bootstrap/all.js"></script>
</body>

</html>
