<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Order List - Staff View</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-image: url('/htmls/picturesSettings/terma45-1-of-1-scaled.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            padding-bottom: 70px;
        }

        .content-wrapper {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            padding: 20px;
            max-width: 600px;
            margin: 20px auto;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #000;
            font-size: 24px;
        }

        .notification-icon {
            font-size: 20px;
        }

        .search-bar {
            background: rgba(255, 255, 255, 0.8);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        .search-bar input {
            border: none;
            background: transparent;
            width: 100%;
            padding-left: 10px;
            font-size: 16px;
            outline: none;
        }

        .food-items {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .food-item {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .food-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 10px;
        }

        .waiting-time {
            margin-bottom: 20px;
        }

        .time-options {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .time-button {
            background: #a7f5d1;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            color: #000;
            font-size: 14px;
            cursor: pointer;
        }

        .time-button.selected {
            background: #50c878;
            color: white;
        }

        .comments-section {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .comment-item {
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            position: relative;
        }

        .customer-comment {
            background: #f0f0f0;
            margin-right: 20px;
        }

        .staff-response {
            background: #e3f2fd;
            margin-left: 20px;
        }

        .user-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .add-response-container {
            position: relative;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .add-response {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            flex-grow: 1;
            border: none;
            outline: none;
            font-size: 16px;
        }

        .submit-arrow {
            background: #fff;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
        }

        .submit-arrow:hover {
            background: #f0f0f0;
        }

        .view-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #fff;
            padding: 5px 10px;
            border-radius: 15px;
            border: 1px solid #ddd;
            cursor: pointer;
        }
    </style>
    <script>
        async function fetchOrders() {
            try {
                const response = await fetch('http://localhost:3000/api/orders');
                if (!response.ok) {
                    throw new Error('Failed to fetch orders');
                }
                const orders = await response.json();

                const ordersContainer = document.getElementById('orders-container');
                ordersContainer.innerHTML = ''; // Clear current orders

                if (orders.length === 0) {
                    ordersContainer.innerHTML = '<p>No orders available</p>';
                } else {
                    orders.forEach(order => {
                        const orderDiv = document.createElement('div');
                        orderDiv.classList.add('order');

                        // Display each item ordered by the customer
                        const itemsList = order.items.map(item => `<li>${item}</li>`).join('');

                        const orderDetails = `
                            <strong>Customer:</strong> ${order.customerName} <br>
                            <strong>Items:</strong> <ul>${itemsList}</ul> <br>
                            <strong>Special Instructions:</strong> ${order.comment} <br>
                            <strong>Time:</strong> ${order.time} <br><br>
                        `;

                        orderDiv.innerHTML = orderDetails;
                        ordersContainer.appendChild(orderDiv);
                    });
                }
            } catch (error) {
                console.error('Error fetching orders:', error);
                const ordersContainer = document.getElementById('orders-container');
                ordersContainer.innerHTML = '<p>Error fetching orders. Please try again later.</p>';
            }
        }

        setInterval(fetchOrders, 2000); // Poll for new orders every 2 seconds
    </script>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">Canteen Management</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/htmls/staff_home_page.html">Menu</a></li>
                <li class="nav-item"><a class="nav-link" href="/htmls/Staff_order_reply.html">Orders</a></li>
                <li class="nav-item"><a class="nav-link" href="/htmls/Staff_user_profile.html">Profile</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Feedback</a></li>
            </ul>
        </div>
    </nav>

    <div class="content-wrapper">
        <div class="header">
            <h1>Customer Order List</h1>
            <span class="notification-icon">🔔</span>
        </div>

        <div class="search-bar">
            <span>🔍</span>
            <input type="text" placeholder="Search">
        </div>

        <!-- Dynamic orders will be displayed here -->
        <div id="orders-container">
            <!-- Orders will be dynamically added here -->
        </div>

        <!-- Comments Section (unchanged) -->
        <div class="comments-section" id="comments-container">
            <!-- Sample customer comment -->
            <div class="comment-item customer-comment">
                <div class="user-label">Customer:</div>
                <div class="comment-text">Please make it less spicy</div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
