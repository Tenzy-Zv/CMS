<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Order View</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Style adjustments for staff order page */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            background-image: url("/htmls/JNEC-Logo-100x100-1-removebg-preview.png");
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            width: 90%;
            padding: 15px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        .order-item {
            border-bottom: 1px solid #ccc;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .order-header {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .order-details {
            font-size: 14px;
        }

        .order-comments {
            font-style: italic;
            color: #555;
        }

        .order-time {
            font-size: 12px;
            color: gray;
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .delete-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>
<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mr-auto">
            <li class="nav-item active">
                <a class="nav-link" href="/htmls/staff_home_page.html">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/htmls/staff_home_page.html">Menu</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/htmls/Staff_order_reply.html">My Order</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/htmls/Staff_user_profile.html">My Profile</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/htmls/staff-VIEW_FEEDBack.html">Feedback</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/htmls/Staff_user_profile.html">Logout</a>
            </li>
        </ul>
    </div>
</nav>
<body>
    <div class="container">
        <h1>All Orders</h1>
        <div id="ordersList"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const ordersList = document.getElementById('ordersList');

            // Retrieve all orders from localStorage
            const orders = JSON.parse(localStorage.getItem('orders')) || [];

            // Display each order
            if (orders.length > 0) {
                orders.forEach((order, index) => {
                    const orderItem = document.createElement('div');
                    orderItem.classList.add('order-item');

                    orderItem.innerHTML = `
                        <div class="order-header">
                            Order placed at: ${new Date(order.orderTime).toLocaleString()}
                        </div>
                        <div class="order-details">
                            <strong>Items:</strong> ${order.items.join(', ')}
                        </div>
                        <div class="order-comments">
                            <strong>Comment:</strong> ${order.comment || 'No comment'}
                        </div>
                        <div class="order-time">
                            <strong>Total Amount:</strong> $${order.totalAmount}
                        </div>
                        <button class="delete-btn" data-index="${index}">Delete</button>
                    `;

                    // Append the order item to the list
                    ordersList.appendChild(orderItem);
                });
            } else {
                ordersList.innerHTML = '<p>No orders placed yet.</p>';
            }

            // Delete order functionality
            ordersList.addEventListener('click', (event) => {
                if (event.target.classList.contains('delete-btn')) {
                    const index = event.target.getAttribute('data-index');
                    const orders = JSON.parse(localStorage.getItem('orders')) || [];

                    // Remove the order from the array
                    orders.splice(index, 1);

                    // Update localStorage with the remaining orders
                    localStorage.setItem('orders', JSON.stringify(orders));

                    // Reload the page to reflect the changes
                    window.location.reload();
                }
            });
        });
    </script>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
