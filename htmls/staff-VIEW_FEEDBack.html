<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Customer Feedback</title>
    <!-- Include Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            background-image: url("/htmls/JNEC-Logo-100x100-1-removebg-preview.png");
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            padding: 20px;
            margin-top: 80px;
        }

        header h1 {
            font-size: 2em;
            color: #e7dada;
        }

        .feedback-section {
            flex-grow: 1;
        }

        .intro-text p {
            background-color: #f9df57;
            padding: 10px;
            border-radius: 8px;
            font-size: 1.1em;
            text-align: center;
        }

        .feedback-box {
            background-color: #ddd;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .staff-section {
            margin-top: 30px;
            text-align: center;
        }

        .button {
            background-color: #3b7a40;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/htmls/staff_home_page.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/htmls/Staff_menu_edit.html">Menu</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/htmls/Staff_order_reply.html">My Order</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/htmls/Staff_user_profile.html">My Profile</a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" href="/htmls/staff-VIEW_FEEDBack.html">View Feedback</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/htmls/Staff_user_profile.html">Logout</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <header>
            <h1>Customer Feedback</h1>
        </header>
        <section class="feedback-section">
            <div class="intro-text">
                <p>Here are the feedbacks submitted by our customers</p>
            </div>
            <div class="feedback" id="feedback-list">
                <!-- Feedback will be dynamically loaded here -->
            </div>
        </section>

        <div class="staff-section">
            <button class="button" onclick="loadFeedback()">Load Feedback</button>
            <button class="button" onclick="deleteFeedback()">Delete All Feedback</button> <!-- Added Delete Feedback Button -->
        </div>
    </div>

    <!-- Include Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        // Function to load feedback from localStorage and display it
        function loadFeedback() {
            var feedbackList = JSON.parse(localStorage.getItem('feedback')) || [];
            var feedbackContainer = document.getElementById('feedback-list');
            feedbackContainer.innerHTML = "";  // Clear previous feedback

            // Display each feedback item
            feedbackList.forEach(function(feedback) {
                var feedbackElement = document.createElement('p');
                feedbackElement.classList.add('feedback-box');
                feedbackElement.textContent = feedback;
                feedbackContainer.appendChild(feedbackElement);
            });

            // If no feedback, show a message
            if (feedbackList.length === 0) {
                feedbackContainer.innerHTML = "<p class='feedback-box'>No feedback available.</p>";
            }
        }

        // Function to delete all feedback from localStorage
        function deleteFeedback() {
            localStorage.removeItem('feedback'); // Remove feedback from localStorage
            document.getElementById('feedback-list').innerHTML = "<p class='feedback-box'>All feedback has been deleted.</p>"; // Update UI
        }
    </script>
</body>
</html>
