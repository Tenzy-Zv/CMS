    <script>
        const drinksList = document.getElementById("drinksList");
        const fastFoodList = document.getElementById("fastFoodList");
        const riceCurryList = document.getElementById("riceCurryList");

        function renderMenuItem(name, imageUrl, category) {
            const item = document.createElement("div");
            item.classList.add("menu-item");
            item.innerHTML = `
                <img src="${imageUrl}" alt="${name}">
                <p>${name}</p>
            `;
            document.getElementById(`${category}List`).appendChild(item);
        }

        function loadItems() {
            const categories = ["drinks", "fastFood", "riceCurry"];

            categories.forEach(category => {
                const storedItems = JSON.parse(localStorage.getItem(category)) || [];
                storedItems.forEach(item => {
                    renderMenuItem(item.name, item.imageUrl, category);
                });
            });
        }

        function filterItems() {
            const searchInput = document.getElementById("searchInput").value.toLowerCase();
            const allItems = document.querySelectorAll(".menu-item");

            allItems.forEach(item => {
                const itemName = item.querySelector("p").textContent.toLowerCase();
                item.style.display = itemName.includes(searchInput) ? "" : "none";
            });
        }

        // Load items when the page loads
        window.onload = loadItems;
    </script>
